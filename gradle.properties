#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

#Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#LinkDrop
# The version of both apps (major.minor.patch, each 0-99). Android's versionCode is derived from it
# (1.2.3 -> 10203), so it must only ever go up. The Arch PKGBUILD's pkgver must match it.
linkdrop.version=1.0.0
# Unencrypted ws:// instead of TLS + pairing, for debugging only. Off: every connection is TLS.
# Turn it on for one build with -Plinkdrop.allowPlaintext=true rather than changing it here.
# While true, Android release builds and desktop packaging FAIL on purpose.
# Android release builds never allow plaintext, whatever this says.
linkdrop.allowPlaintext=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true