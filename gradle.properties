#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#LinkDrop
# Allows unencrypted ws:// connections (development only, until TLS + pairing exist).
# While true, Android release builds and desktop packaging FAIL on purpose.
# Android release builds never allow plaintext, whatever this says.
linkdrop.allowPlaintext=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true